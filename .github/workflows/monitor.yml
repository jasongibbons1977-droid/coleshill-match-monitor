name: Coleshill match monitor

on:
  schedule:
    # UTC envelope covers daytime and evening fixtures across GMT and BST.
    # Python applies Europe/London match windows and ignores non-match days.
    - cron: '*/5 11-23 * * 1-6'
  workflow_dispatch:
  push:
    paths:
      - monitor.py
      - test_monitor.py
      - .github/workflows/monitor.yml

permissions:
  contents: read

concurrency:
  group: coleshill-match-monitor
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Test event handling and deduplication
        run: python3 -m unittest -v
      - name: Verify live source access
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python3 monitor.py --check-source >> "$GITHUB_STEP_SUMMARY"

  monitor:
    if: github.event_name != 'push'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Check for match updates and create drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 monitor.py
      - name: Save deduplication state
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Save match monitor state [skip ci]'
              git push
            fi
          fi
